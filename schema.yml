openapi: 3.0.3
info:
  title: Todos and Reminders API
  version: 1.0.0
  description: REST API for boards, todos and email reminders.
paths:
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/boards/:
    get:
      operationId: boards_list
      description: Boards of the current user only.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoardListList'
          description: ''
    post:
      operationId: boards_create
      description: Boards of the current user only.
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/boards/{board_pk}/todos/:
    get:
      operationId: boards_todos_list
      description: Use `?done=false` to get only uncompleted todos.
      summary: List todos of a board
      parameters:
      - in: path
        name: board_pk
        schema:
          type: integer
        required: true
      - in: query
        name: done
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTodoList'
          description: ''
    post:
      operationId: boards_todos_create
      description: Todos of one board; the board must belong to the current user.
      parameters:
      - in: path
        name: board_pk
        schema:
          type: integer
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
  /api/boards/{board_pk}/todos/{id}/:
    get:
      operationId: boards_todos_retrieve
      description: Todos of one board; the board must belong to the current user.
      parameters:
      - in: path
        name: board_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
    put:
      operationId: boards_todos_update
      description: Todos of one board; the board must belong to the current user.
      parameters:
      - in: path
        name: board_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
    patch:
      operationId: boards_todos_partial_update
      description: Todos of one board; the board must belong to the current user.
      parameters:
      - in: path
        name: board_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTodoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
    delete:
      operationId: boards_todos_destroy
      description: Todos of one board; the board must belong to the current user.
      parameters:
      - in: path
        name: board_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/boards/{id}/:
    get:
      operationId: boards_retrieve
      description: Boards of the current user only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDetail'
          description: ''
    put:
      operationId: boards_update
      description: Boards of the current user only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
    patch:
      operationId: boards_partial_update
      description: Boards of the current user only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBoardRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
    delete:
      operationId: boards_destroy
      description: Boards of the current user only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/reminders/:
    get:
      operationId: reminders_list
      description: List, create and delete reminders of the current user.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - reminders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReminderList'
          description: ''
    post:
      operationId: reminders_create
      description: List, create and delete reminders of the current user.
      tags:
      - reminders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
          description: ''
  /api/reminders/{id}/:
    delete:
      operationId: reminders_destroy
      description: List, create and delete reminders of the current user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this reminder.
        required: true
      tags:
      - reminders
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Board:
      type: object
      description: Used for create and update, so the response stays small.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    BoardDetail:
      type: object
      description: Used for create and update, so the response stays small.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        todos:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
          readOnly: true
      required:
      - id
      - name
      - todos
    BoardList:
      type: object
      description: Used for create and update, so the response stays small.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        todo_count:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - todo_count
    BoardRequest:
      type: object
      description: Used for create and update, so the response stays small.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    PaginatedBoardListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/BoardList'
    PaginatedReminderList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
    PaginatedTodoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
    PatchedBoardRequest:
      type: object
      description: Used for create and update, so the response stays small.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    PatchedTodoRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        done:
          type: boolean
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
      required:
      - email
      - id
      - username
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
      - username
    Reminder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        text:
          type: string
          maxLength: 1000
        delay_minutes:
          type: integer
          maximum: 1440
          minimum: 1
        created:
          type: string
          format: date-time
          readOnly: true
        send_at:
          type: string
          format: date-time
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created
      - delay_minutes
      - email
      - id
      - send_at
      - sent_at
      - text
    ReminderRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        text:
          type: string
          minLength: 1
          maxLength: 1000
        delay_minutes:
          type: integer
          maximum: 1440
          minimum: 1
      required:
      - delay_minutes
      - email
      - text
    Todo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        done:
          type: boolean
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - id
      - title
      - updated
    TodoRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        done:
          type: boolean
      required:
      - title
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
